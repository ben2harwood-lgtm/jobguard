name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  core-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4.2.2
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Verify the candidate SHA
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          actual_sha=$(git rev-parse HEAD)
          printf 'Candidate SHA: %s\n' "$actual_sha"
          test "$actual_sha" = "$EXPECTED_SHA"
      - uses: pnpm/action-setup@v4.1.0
        with: { version: 10.28.1, run_install: false }
      - uses: actions/setup-node@v4.0.3
        with: { node-version: 24.15.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # The root test script's tools and every non-DB workspace test stay here.
      # The entire DB test command runs across core-db below, with its own prerequisites.
      - run: node --test tools/*.test.mjs
      - run: pnpm exec turbo run test --filter='!@jobguard/db'
  core-db:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4.2.2
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Verify the candidate SHA
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          actual_sha=$(git rev-parse HEAD)
          printf 'Candidate SHA: %s\n' "$actual_sha"
          test "$actual_sha" = "$EXPECTED_SHA"
      - uses: pnpm/action-setup@v4.1.0
        with: { version: 10.28.1, run_install: false }
      - uses: actions/setup-node@v4.0.3
        with: { node-version: 24.15.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # DB tests also import built API/AI output outside the DB dependency graph.
      # This closure matches every build task in the original root test graph.
      - run: pnpm exec turbo run build --filter=@jobguard/api...
      - run: pnpm --filter @jobguard/db test --shard=${{ matrix.shard }}/4
  core:
    needs: [core-checks, core-db]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Require all core checks and DB shards to succeed
        env:
          CORE_CHECKS: ${{ needs.core-checks.result }}
          CORE_DB: ${{ needs.core-db.result }}
        run: |
          printf 'core-checks: %s\ncore-db: %s\n' "${CORE_CHECKS:-}" "${CORE_DB:-}"
          if [ "${CORE_CHECKS:-}" != "success" ] ||
             [ "${CORE_DB:-}" != "success" ]; then
            exit 1
          fi
  web-shards:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4.2.2
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Verify the candidate SHA
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          actual_sha=$(git rev-parse HEAD)
          printf 'Candidate SHA: %s\n' "$actual_sha"
          test "$actual_sha" = "$EXPECTED_SHA"
      - uses: pnpm/action-setup@v4.1.0
        with: { version: 10.28.1, run_install: false }
      - uses: actions/setup-node@v4.0.3
        with: { node-version: 24.15.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install the browser used by the existing end-to-end suite
        run: pnpm --filter @jobguard/web exec playwright install --with-deps chromium
      - name: Exercise the production web build at mobile and desktop sizes
        run: pnpm test:e2e --shard=${{ matrix.shard }}/4
      - name: Upload Playwright failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: playwright-evidence-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14
          if-no-files-found: warn
  web:
    needs: [web-shards]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Require every browser shard to succeed
        env:
          WEB_SHARDS: ${{ needs.web-shards.result }}
        run: |
          printf 'web-shards: %s\n' "${WEB_SHARDS:-}"
          if [ "${WEB_SHARDS:-}" != "success" ]; then
            exit 1
          fi
  checks:
    needs: [core, web, secrets, dependency-review]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check to succeed
        env:
          CORE: ${{ needs.core.result }}
          WEB: ${{ needs.web.result }}
          SECRETS: ${{ needs.secrets.result }}
          DEPENDENCY_REVIEW: ${{ needs.dependency-review.result }}
        run: |
          printf 'core: %s\nweb: %s\nsecrets: %s\ndependency-review: %s\n' "${CORE:-}" "${WEB:-}" "${SECRETS:-}" "${DEPENDENCY_REVIEW:-}"
          if [ "${CORE:-}" != "success" ] ||
             [ "${WEB:-}" != "success" ] ||
             [ "${SECRETS:-}" != "success" ] ||
             [ "${DEPENDENCY_REVIEW:-}" != "success" ]; then
            exit 1
          fi
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: gitleaks/gitleaks-action@v2.3.7
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
  dependency-review:
    # The existing check name now represents a real scan, including private repositories.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4.2.2
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v4.1.0
        with: { version: 10.28.1, run_install: false }
      - uses: actions/setup-node@v4.0.3
        with: { node-version: 24.15.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Audit all dependency scopes; findings and lookup errors fail
        run: node tools/dependency-audit.mjs
  offline-workbench:
    # Disposable developer fixture only. Never runs on main or arbitrary PRs.
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/m0-1/offline-test-workbench' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4.2.2
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: pnpm/action-setup@v4.1.0
        with: { version: 10.28.1, run_install: false }
      - uses: actions/setup-node@v4.0.3
        with: { node-version: 24.15.0 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jobguard/web exec playwright install chromium
      - name: Package only code, pinned dependencies and disposable tooling
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/jobguard-offline-workbench"
          mkdir -p "$out/tooling/bin" "$out/artifact"
          # No runner HOME, credentials, environment dump, .env, databases or
          # generated customer documents are included. Git credentials are not persisted.
          git bundle create "$out/artifact/source.bundle" HEAD
          tar -czf "$out/artifact/dependencies.tar.gz" node_modules apps/*/node_modules packages/*/node_modules
          cp "$(command -v node)" "$out/tooling/bin/node"
          cp -aL "$PNPM_HOME/../pnpm" "$out/tooling/pnpm"
          tar -czf "$out/artifact/tooling.tar.gz" -C "$out" tooling
          tar -czf "$out/artifact/browsers.tar.gz" -C "$HOME/.cache" ms-playwright
          {
            printf 'commit='; git rev-parse HEAD
            printf 'node='; node --version
            printf 'pnpm='; pnpm --version
            printf 'lockfile_sha256='; sha256sum pnpm-lock.yaml | cut -d' ' -f1
            printf 'purpose=synthetic local development only; not a release or review verdict\n'
          } > "$out/artifact/manifest.txt"
          (cd "$out/artifact" && sha256sum source.bundle dependencies.tar.gz tooling.tar.gz browsers.tar.gz > SHA256SUMS)
      - name: Retain immutable disposable workbench for one day
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: jobguard-offline-workbench-${{ github.sha }}
          path: |
            ${{ runner.temp }}/jobguard-offline-workbench/artifact/source.bundle
            ${{ runner.temp }}/jobguard-offline-workbench/artifact/dependencies.tar.gz
            ${{ runner.temp }}/jobguard-offline-workbench/artifact/tooling.tar.gz
            ${{ runner.temp }}/jobguard-offline-workbench/artifact/manifest.txt
            ${{ runner.temp }}/jobguard-offline-workbench/artifact/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Retain separate disposable test browser
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: jobguard-offline-browser-${{ github.sha }}
          path: ${{ runner.temp }}/jobguard-offline-workbench/artifact/browsers.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Retain standalone pinned pnpm package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: jobguard-offline-pnpm-${{ github.sha }}
          path: ${{ runner.temp }}/jobguard-offline-workbench/tooling/pnpm/
          if-no-files-found: error
          compression-level: 1
          retention-days: 1
