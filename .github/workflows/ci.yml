name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, v2/main]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  core-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4.2.2
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Verify the candidate SHA
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          actual_sha=$(git rev-parse HEAD)
          printf 'Candidate SHA: %s\n' "$actual_sha"
          test "$actual_sha" = "$EXPECTED_SHA"
      - uses: pnpm/action-setup@v4.1.0
        with: { version: 10.28.1, run_install: false }
      - uses: actions/setup-node@v4.0.3
        with: { node-version: 24.15.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Q18 / V2-CI2: keep CI1's seed job unchanged. Its base-only scope misses
      # Codex V2 heads stacked on Claude bases (#932), so these pointers run here.
      - name: List V2 audit-chain review pointers
        if: ${{ github.event_name == 'pull_request' && github.base_ref != 'main' && (github.base_ref == 'v2/main' || startsWith(github.base_ref, 'codex/sandbox/v2-') || startsWith(github.head_ref, 'codex/sandbox/v2-')) || github.event_name == 'push' && github.ref == 'refs/heads/v2/main' }}
        run: |
          node --test tools/v2-audit-chain-guard.test.mjs
          node tools/v2/audit-chain-guard.mjs
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Evaluate AI contracts through the fixture gateway (zero spend)
        run: |
          pnpm exec turbo run build --filter=@jobguard/ai...
          pnpm --filter @jobguard/ai eval:contract
      # The root test script's tools and every non-DB workspace test stay here.
      # The entire DB test command runs across core-db below, with its own prerequisites.
      - run: node --test tools/*.test.mjs
      - run: pnpm exec turbo run test --filter='!@jobguard/db'
  core-db:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4.2.2
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Verify the candidate SHA
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          actual_sha=$(git rev-parse HEAD)
          printf 'Candidate SHA: %s\n' "$actual_sha"
          test "$actual_sha" = "$EXPECTED_SHA"
      - uses: pnpm/action-setup@v4.1.0
        with: { version: 10.28.1, run_install: false }
      - uses: actions/setup-node@v4.0.3
        with: { node-version: 24.15.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # DB tests also import built API/AI output outside the DB dependency graph.
      # This closure matches every build task in the original root test graph.
      - run: pnpm exec turbo run build --filter=@jobguard/api...
      - run: pnpm --filter @jobguard/db test --shard=${{ matrix.shard }}/4
  core:
    needs: [core-checks, core-db]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Require all core checks and DB shards to succeed
        env:
          CORE_CHECKS: ${{ needs.core-checks.result }}
          CORE_DB: ${{ needs.core-db.result }}
        run: |
          printf 'core-checks: %s\ncore-db: %s\n' "${CORE_CHECKS:-}" "${CORE_DB:-}"
          if [ "${CORE_CHECKS:-}" != "success" ] ||
             [ "${CORE_DB:-}" != "success" ]; then
            exit 1
          fi
  web-shards:
    strategy:
      fail-fast: false
      matrix:
        # J3 shares its full journey across read-only assertion groups.
        # Six shards limit runner queueing; both viewport projects still run.
        # Keep one worker per runner: specs share its synthetic DB and worker.
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4.2.2
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Verify the candidate SHA
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          actual_sha=$(git rev-parse HEAD)
          printf 'Candidate SHA: %s\n' "$actual_sha"
          test "$actual_sha" = "$EXPECTED_SHA"
      - uses: pnpm/action-setup@v4.1.0
        with: { version: 10.28.1, run_install: false }
      - uses: actions/setup-node@v4.0.3
        with: { node-version: 24.15.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install the browser used by the existing end-to-end suite
        run: pnpm --filter @jobguard/web exec playwright install --with-deps chromium
      - name: Exercise the production web build at mobile and desktop sizes
        run: pnpm test:e2e --shard=${{ matrix.shard }}/6
      - name: Upload Playwright failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: playwright-evidence-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14
          if-no-files-found: warn
  web:
    needs: [web-shards]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Require every browser shard to succeed
        env:
          WEB_SHARDS: ${{ needs.web-shards.result }}
        run: |
          printf 'web-shards: %s\n' "${WEB_SHARDS:-}"
          if [ "${WEB_SHARDS:-}" != "success" ]; then
            exit 1
          fi
  v2-seed:
    # V2's database seed suite, against V2's own embedded PostgreSQL on loopback.
    # It runs only for V2 pull requests and pushes to v2/main; main is unaffected.
    # Keep this condition identical to V2_SEED_REQUIRED in the checks gate.
    if: ${{ github.event_name == 'pull_request' && (github.base_ref == 'v2/main' || startsWith(github.base_ref, 'codex/sandbox/v2-')) || github.event_name == 'push' && github.ref == 'refs/heads/v2/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4.2.2
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Verify the candidate SHA
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          actual_sha=$(git rev-parse HEAD)
          printf 'Candidate SHA: %s\n' "$actual_sha"
          test "$actual_sha" = "$EXPECTED_SHA"
      - uses: pnpm/action-setup@v4.1.0
        with: { version: 10.28.1, run_install: false }
      - uses: actions/setup-node@v4.0.3
        with: { node-version: 24.15.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Run the V2 seed suite against the embedded local stack
        # The launcher refuses inherited endpoints and proxies, so it and the suite get a
        # cleared environment. If its local-only checks refuse to start, this step fails.
        run: |
          store_dir=$(pnpm store path --silent)
          clean=(env -i "PATH=$PATH" "HOME=$HOME" "LANG=C.UTF-8" "npm_config_store_dir=$store_dir"
            "COREPACK_ENABLE_DOWNLOAD_PROMPT=0" "JOBGUARD_V2_BACKEND=embedded")
          log="$RUNNER_TEMP/v2-launcher.log"
          "${clean[@]}" setsid node tools/v2/start.mjs >"$log" 2>&1 &
          launcher=$!
          stop() { kill -TERM -- "-$launcher" 2>/dev/null || true; wait "$launcher" 2>/dev/null || true; }
          trap stop EXIT
          deadline=$((SECONDS + 1200))
          until grep -q '^JobGuard V2 API: ' "$log"; do
            if ! kill -0 "$launcher" 2>/dev/null; then
              cat "$log"; echo "The V2 launcher refused to start or exited early." >&2; exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              cat "$log"; echo "The V2 launcher did not become ready in 20 minutes." >&2; exit 1
            fi
            sleep 5
          done
          tail -n 20 "$log"
          status=0
          "${clean[@]}" JOBGUARD_ENV=synthetic_demo node --test tools/v2/seed.integration.test.mjs || status=$?
          if [ "$status" -ne 0 ]; then tail -n 200 "$log"; fi
          exit "$status"
  checks:
    needs: [core, web, secrets, dependency-review, v2-seed]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check to succeed
        env:
          CORE: ${{ needs.core.result }}
          WEB: ${{ needs.web.result }}
          SECRETS: ${{ needs.secrets.result }}
          DEPENDENCY_REVIEW: ${{ needs.dependency-review.result }}
          V2_SEED: ${{ needs.v2-seed.result }}
          V2_SEED_REQUIRED: ${{ github.event_name == 'pull_request' && (github.base_ref == 'v2/main' || startsWith(github.base_ref, 'codex/sandbox/v2-')) || github.event_name == 'push' && github.ref == 'refs/heads/v2/main' }}
        run: |
          printf 'core: %s\nweb: %s\nsecrets: %s\ndependency-review: %s\n' "${CORE:-}" "${WEB:-}" "${SECRETS:-}" "${DEPENDENCY_REVIEW:-}"
          printf 'v2-seed: %s\nv2-seed required: %s\n' "${V2_SEED:-}" "${V2_SEED_REQUIRED:-}"
          # V2 runs must pass the seed suite; every other run must have skipped it.
          if [ "${V2_SEED_REQUIRED:-}" = "true" ]; then
            expected_v2_seed=success
          elif [ "${V2_SEED_REQUIRED:-}" = "false" ]; then
            expected_v2_seed=skipped
          else
            exit 1
          fi
          if [ "${CORE:-}" != "success" ] ||
             [ "${WEB:-}" != "success" ] ||
             [ "${SECRETS:-}" != "success" ] ||
             [ "${DEPENDENCY_REVIEW:-}" != "success" ] ||
             [ "${V2_SEED:-}" != "$expected_v2_seed" ]; then
            exit 1
          fi
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: gitleaks/gitleaks-action@v2.3.7
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
  dependency-review:
    # The existing check name now represents a real scan, including private repositories.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4.2.2
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v4.1.0
        with: { version: 10.28.1, run_install: false }
      - uses: actions/setup-node@v4.0.3
        with: { node-version: 24.15.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Audit all dependency scopes; findings and lookup errors fail
        run: node tools/dependency-audit.mjs
