name: One-time JobGuard dependency repair
on:
  push:
    branches: [codex/fix-jobguard-ci-guards-2026-09-14]
permissions:
  contents: read
concurrency:
  group: jobguard-dependency-repair-once
  cancel-in-progress: false
jobs:
  refresh:
    if: >-
      github.repository == 'ben2harwood-lgtm/jobguard' && startsWith(github.event.head_commit.message, 'fix(deps): prepare audited security refresh')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4.1.0
        with: { version: 10.28.1, run_install: false }
      - uses: actions/setup-node@v4.0.3
        with: { node-version: 24.15.0 }
      - name: Resolve bounded security updates and regenerate lockfile without lifecycle scripts
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { execFileSync, spawnSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          const branch = 'codex/fix-jobguard-ci-guards-2026-09-14';
          if (process.env.GITHUB_REPOSITORY !== 'ben2harwood-lgtm/jobguard' || process.env.GITHUB_REF_NAME !== branch) throw new Error('Wrong repository or branch; refusing maintenance.');
          const files = ['package.json','apps/api/package.json','apps/web/package.json','packages/ai/package.json','packages/config/package.json','packages/core/package.json','packages/db/package.json','packages/storage/package.json'];
          const read = (file) => JSON.parse(readFileSync(file, 'utf8'));
          const save = (file, value) => writeFileSync(file, `${JSON.stringify(value, null, 2)}\n`);
          const manifests = new Map(files.map((file) => [file, read(file)]));
          const baselineLockSha256 = createHash('sha256').update(readFileSync('pnpm-lock.yaml')).digest('hex');
          const baseline = spawnSync('pnpm', ['audit','--json','--ignore-registry-errors=false','--ignore-unfixable=false'], {encoding:'utf8',timeout:120000,maxBuffer:16*1024*1024});
          let baselineCounts = null;
          try { baselineCounts = JSON.parse(baseline.stdout).metadata?.vulnerabilities ?? null; } catch {}
          console.log('BASELINE_AUDIT', JSON.stringify(baselineCounts ?? {error:'No complete baseline report'}));
          const specs = {
            next: ['15.5.24','15.6.0'],
            react: ['19.1.0','19.2.0'], 'react-dom': ['19.1.0','19.2.0'],
            '@nestjs/common': ['11.1.18','12.0.0'], '@nestjs/core': ['11.1.18','12.0.0'],
            '@nestjs/platform-express': ['11.1.18','12.0.0'], '@nestjs/testing': ['11.1.18','12.0.0'],
            '@nestjs/cli': ['11.0.7','12.0.0'], '@nestjs/swagger': ['11.2.0','12.0.0'],
            '@aws-sdk/client-s3': ['3.883.0','4.0.0'], '@aws-sdk/s3-request-presigner': ['3.883.0','4.0.0'],
            '@playwright/test': ['1.55.1','1.56.0'],
            turbo: ['2.9.14','3.0.0'], 'drizzle-orm': ['0.45.2','0.46.0'],
            vitest: ['4.1.11','4.2.0'],
          };
          const indirect = {
            'multer@>=2.0.0 <2.3.0': ['multer','2.3.0','3.0.0'],
            'postcss@<8.5.23': ['postcss','8.5.23','9.0.0'],
            'sharp@>=0.34.0 <0.35.4': ['sharp','0.35.4','0.36.0'],
            'js-yaml@>=4.0.0 <4.3.2': ['js-yaml','4.3.2','5.0.0'],
            'lodash@>=4.0.0 <4.18.0': ['lodash','4.18.0','5.0.0'],
            'glob@>=11.0.0 <11.1.0': ['glob','11.1.0','12.0.0'],
            'ajv@>=8.0.0 <8.18.0': ['ajv','8.18.0','9.0.0'],
            'file-type@>=21.0.0 <21.3.2': ['file-type','21.3.2','22.0.0'],
            'picomatch@>=4.0.0 <4.0.4': ['picomatch','4.0.4','5.0.0'],
            'picomatch@>=3.0.0 <3.0.2': ['picomatch','3.0.2','4.0.0'],
            'picomatch@>=2.0.0 <2.3.2': ['picomatch','2.3.2','3.0.0'],
            'path-to-regexp@>=8.0.0 <8.4.0': ['path-to-regexp','8.4.0','9.0.0'],
            'fast-xml-parser@>=5.0.0 <5.7.0': ['fast-xml-parser','5.7.0','6.0.0'],
            'webpack@>=5.49.0 <5.104.1': ['webpack','5.104.1','6.0.0'],
          };
          const cmp = (a,b) => { const aa=a.split('.').map(Number),bb=b.split('.').map(Number); for(let i=0;i<3;i++) if(aa[i]!==bb[i]) return aa[i]-bb[i]; return 0; };
          const cache = new Map();
          async function select(name, min, max) {
            if (!cache.has(name)) cache.set(name, (async () => {
              const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}`, {signal:AbortSignal.timeout(60000)});
              if (!response.ok) throw new Error(`Package metadata lookup failed: ${name} (${response.status})`);
              return response.json();
            })());
            const metadata = await cache.get(name);
            const cutoff = Date.now() - 48*60*60*1000;
            const candidates = Object.keys(metadata.versions).filter((v) => /^\d+\.\d+\.\d+$/u.test(v) && cmp(v,min)>=0 && cmp(v,max)<0 && !metadata.versions[v].deprecated && Date.parse(metadata.time?.[v]) <= cutoff).sort(cmp);
            const version=candidates.at(-1);
            if (!version) throw new Error(`No established, nondeprecated release found for ${name} in [${min}, ${max})`);
            console.log('RESOLVED',name,version);
            return version;
          }
          const pins = {};
          for (const [name,[min,max]] of Object.entries(specs)) pins[name]=await select(name,min,max);
          for (const group of [['react','react-dom'],['@nestjs/common','@nestjs/core','@nestjs/platform-express','@nestjs/testing'],['@aws-sdk/client-s3','@aws-sdk/s3-request-presigner']]) {
            if (new Set(group.map((name)=>pins[name])).size !== 1) throw new Error(`Release family mismatch: ${group.join(', ')}`);
          }
          const changes=[];
          for(const [file,manifest] of manifests) {
            for(const section of ['dependencies','devDependencies']) for(const [name,version] of Object.entries(pins)) if(Object.hasOwn(manifest[section]??{},name) && manifest[section][name] !== version) {
              changes.push({file,section,package:name,before:manifest[section][name],after:version}); manifest[section][name]=version;
            }
          }
          const root=manifests.get('package.json'); root.pnpm ??= {}; root.pnpm.overrides ??= {};
          for(const [selector,[name,min,max]] of Object.entries(indirect)) {
            const version=await select(name,min,max);
            if(Object.hasOwn(root.pnpm.overrides,selector) && root.pnpm.overrides[selector]!==version) throw new Error(`Existing override conflicts: ${selector}`);
            root.pnpm.overrides[selector]=version;
          }
          for(const [file,manifest] of manifests) if(changes.some((change)=>change.file===file) || file==='package.json') save(file,manifest);
          const policy=read('config/agent-lane-assignments.json');
          const allowed=[...files,'pnpm-lock.yaml','.github/workflows/dependency-repair-once.yml','docs/operations/dependency-remediation-2026-09-14.json','docs/decisions/CI-SECURITY-REFRESH-2026-09-14.md','apps/web/playwright.config.ts','apps/web/tsconfig.json'];
          policy.lanes['ci-repair'].allow=[...new Set([...policy.lanes['ci-repair'].allow,...allowed])];
          save('config/agent-lane-assignments.json',policy);
          save('docs/operations/dependency-remediation-2026-09-14.json',{
            schemaVersion:1, task:'JobGuard CI and dependency security repair', generatedAt:new Date().toISOString(),
            baseCommit:process.env.GITHUB_SHA, baselineLockSha256, baselineCounts,changes,overrides:root.pnpm.overrides,
            verification:'Versions resolved from the public npm registry; scan and tests must be read from the subsequent hosted run. No approval or successful test execution is implied.'
          });
          execFileSync('pnpm',['install','--lockfile-only','--ignore-scripts'],{stdio:'inherit',timeout:300000});
          console.log('DEPENDENCY_REFRESH_WRITTEN', JSON.stringify({changedDirectPins:changes.length,baselineCounts}));
          NODE
      - name: Real advisory check before publishing dependency changes
        run: |
          node --input-type=module <<'NODE'
          import { runAudit } from './tools/dependency-audit.mjs';
          const result = runAudit();
          console.log('AFTER_AUDIT', JSON.stringify(result.report?.metadata ?? {error:result.message}));
          for (const advisory of Object.values(result.report?.advisories ?? {})) console.log('ADVISORY', JSON.stringify({package:advisory.module_name,id:advisory.github_advisory_id,severity:advisory.severity,patched:advisory.patched_versions,versions:advisory.findings?.map(f=>f.version)}));
          console.log(result.message);
          process.exitCode = result.code;
          NODE
      - name: Publish only generated dependency files to the same repair branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const git = (...args) => execFileSync('git',args,{encoding:'utf8'}).trim();
          const branch='codex/fix-jobguard-ci-guards-2026-09-14';
          const allowed=new Set(['package.json','apps/api/package.json','apps/web/package.json','packages/ai/package.json','packages/config/package.json','packages/core/package.json','packages/db/package.json','packages/storage/package.json','pnpm-lock.yaml','config/agent-lane-assignments.json','docs/operations/dependency-remediation-2026-09-14.json']);
          const changed=[...git('diff','--name-only','-z').split('\0'),...git('ls-files','--others','--exclude-standard','-z').split('\0')].filter(Boolean);
          if(!changed.length || changed.some(file=>!allowed.has(file))) throw new Error(`Unexpected generated file set: ${JSON.stringify(changed)}`);
          git('config','user.name','github-actions[bot]');
          git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com');
          git('add','--',...changed);
          git('commit','-m','fix(deps): pin audited security updates; full CI still required');
          const auth=Buffer.from(`x-access-token:${process.env.GH_TOKEN}`).toString('base64');
          console.log(`::add-mask::${auth}`);
          execFileSync('git',['-c',`http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}`,'push','origin',`HEAD:refs/heads/${branch}`],{stdio:'inherit'});
          console.log('PUBLISHED_DEPENDENCY_COMMIT',git('rev-parse','HEAD'));
          NODE
