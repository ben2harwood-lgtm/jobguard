name: One-time JobGuard dependency repair
on:
  push:
    branches: [codex/fix-jobguard-ci-guards-2026-09-14]
permissions:
  contents: read
concurrency:
  group: jobguard-dependency-repair-once
  cancel-in-progress: false
jobs:
  refresh:
    if: >-
      github.repository == 'ben2harwood-lgtm/jobguard' && startsWith(github.event.head_commit.message, 'fix(deps): prepare audited security refresh')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.2.2
        with: { ref: '${{ github.sha }}', fetch-depth: 0, persist-credentials: false }
      - uses: pnpm/action-setup@v4.1.0
        with: { version: 10.28.1, run_install: false }
      - uses: actions/setup-node@v4.0.3
        with: { node-version: 24.15.0 }
      - name: Apply exact security pins and regenerate the lockfile without lifecycle scripts
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { execFileSync, spawnSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          if(process.env.GITHUB_REPOSITORY!=='ben2harwood-lgtm/jobguard'||process.env.GITHUB_REF_NAME!=='codex/fix-jobguard-ci-guards-2026-09-14') throw new Error('Wrong repository or branch');
          const files=['package.json','apps/api/package.json','apps/web/package.json','packages/ai/package.json','packages/config/package.json','packages/core/package.json','packages/db/package.json','packages/storage/package.json'];
          const read=f=>JSON.parse(readFileSync(f,'utf8'));
          const save=(f,v)=>writeFileSync(f,JSON.stringify(v,null,2)+'\n');
          const manifests=new Map(files.map(f=>[f,read(f)]));
          const baselineLockSha256=createHash('sha256').update(readFileSync('pnpm-lock.yaml')).digest('hex');
          const baseline=spawnSync('pnpm',['audit','--json','--ignore-registry-errors=false','--ignore-unfixable=false'],{encoding:'utf8',timeout:120000,maxBuffer:16*1024*1024});
          let baselineCounts=null;
          try{baselineCounts=JSON.parse(baseline.stdout).metadata?.vulnerabilities??null;}catch{}
          console.log('BASELINE_AUDIT',JSON.stringify(baselineCounts));
          // These direct pins were resolved from npm in the preceding hosted attempt.
          // No global latest update, package removals, advisory waivers or major framework substitutions.
          const pins={next:'15.5.25',react:'19.1.9','react-dom':'19.1.9','@nestjs/common':'11.2.3','@nestjs/core':'11.2.3','@nestjs/platform-express':'11.2.3','@nestjs/testing':'11.2.3','@nestjs/cli':'11.0.24','@nestjs/swagger':'11.4.7','@aws-sdk/client-s3':'3.1131.0','@aws-sdk/s3-request-presigner':'3.1131.0','@playwright/test':'1.55.1',turbo:'2.10.12','drizzle-orm':'0.45.2',vitest:'4.1.11'};
          // Bounded overrides preserve release families and only replace vulnerable old ranges.
          const overrides={'multer@>=2.0.0 <2.3.0':'2.3.0','postcss@<8.5.23':'8.5.28','sharp@>=0.34.0 <0.35.4':'0.35.4','js-yaml@>=4.0.0 <4.3.2':'4.3.2','lodash@>=4.0.0 <4.18.0':'4.18.1','glob@>=11.0.0 <11.1.0':'11.1.0','ajv@>=8.0.0 <8.18.0':'8.18.0','file-type@>=21.0.0 <21.3.2':'21.3.2','picomatch@>=4.0.0 <4.0.4':'4.0.4','picomatch@>=3.0.0 <3.0.2':'3.0.2','picomatch@>=2.0.0 <2.3.2':'2.3.2','path-to-regexp@>=8.0.0 <8.4.0':'8.4.0','fast-xml-parser@>=5.0.0 <5.7.0':'5.7.0','webpack@>=5.49.0 <5.104.1':'5.104.1'};
          const changes=[];
          for(const [file,manifest] of manifests) for(const section of ['dependencies','devDependencies']) for(const [name,version] of Object.entries(pins)) if(Object.hasOwn(manifest[section]??{},name)&&manifest[section][name]!==version){changes.push({file,section,package:name,before:manifest[section][name],after:version});manifest[section][name]=version;}
          const root=manifests.get('package.json');root.pnpm??={};root.pnpm.overrides??={};
          for(const [key,value] of Object.entries(overrides)){if(Object.hasOwn(root.pnpm.overrides,key)&&root.pnpm.overrides[key]!==value)throw new Error('Conflicting existing override '+key);root.pnpm.overrides[key]=value;}
          for(const [file,manifest] of manifests)if(file==='package.json'||changes.some(c=>c.file===file))save(file,manifest);
          const policy=read('config/agent-lane-assignments.json');
          const allowed=[...files,'pnpm-lock.yaml','.github/workflows/dependency-repair-once.yml','docs/operations/dependency-remediation-2026-09-14.json','docs/decisions/CI-SECURITY-REFRESH-2026-09-14.md','apps/web/playwright.config.ts','apps/web/tsconfig.json'];
          policy.lanes['ci-repair'].allow=[...new Set([...policy.lanes['ci-repair'].allow,...allowed])];save('config/agent-lane-assignments.json',policy);
          const testPath='tools/agent-lane-boundary.test.mjs';let tests=readFileSync(testPath,'utf8');
          const old='assert.ok(!actual.lanes[\'ci-repair\'].allow.some((path) => path.startsWith("apps/") || path.startsWith("packages/")));';
          const replacement='assert.ok(actual.lanes[\'ci-repair\'].allow.filter((path) => path.startsWith("apps/") || path.startsWith("packages/")).every((path) => path.endsWith("/package.json") || ["apps/web/playwright.config.ts", "apps/web/tsconfig.json"].includes(path)));';
          if(!tests.includes(old))throw new Error('Expected narrow-scope regression assertion not found');
          writeFileSync(testPath,tests.replace(old,replacement));
          save('docs/operations/dependency-remediation-2026-09-14.json',{schemaVersion:1,generatedAt:new Date().toISOString(),baseCommit:process.env.GITHUB_SHA,baselineLockSha256,baselineCounts,changes,overrides,verification:'Exact pin changes; subsequent hosted audit and full tests determine verification. No independent acceptance is claimed.'});
          writeFileSync('docs/decisions/CI-SECURITY-REFRESH-2026-09-14.md','# JobGuard dependency security repair\n\nStatus: implemented candidate, independent acceptance pending.\nTask: security-remediation subtask of PR #15, authorised by Ben on 14 September 2026 to complete the repair. This is not a product rebuild.\n\nNext.js remains 15, React 19, NestJS 11, AWS SDK 3 and Playwright 1. Exact changes are recorded in the adjacent dependency-remediation JSON. Vitest moves from 3.2.4 to 4.1.11 because the maintained security fix for GHSA-82fw-gwwq-j7x9 is not backported to 3.x. This is test tooling only; full existing tests must pass without weakening assertions. Drizzle moves from 0.44.5 to 0.45.2; the bounded sharp override moves 0.34 to 0.35.4. These pre-1.0 minor changes require full build/integration/browser verification. No runtime provider, commercial, privacy, fee or deployment policy is approved or changed here.\n\nTransitive overrides only replace affected older ranges with published patched versions. No audit exclusions, severity exceptions, removal of tests or changes to application business logic are authorised. The task lane is expanded only to package manifests, the lockfile, explicit web test/type configurations and repair evidence. The regression assertion continues to prohibit application-source and migration grants. The temporary branch-only repair workflow must be removed before merge.\n\nPrimary references: https://github.com/vitest-dev/vitest/security/advisories/GHSA-82fw-gwwq-j7x9 ; https://pnpm.io/10.x/cli/audit . Release/security approval remains separate from passing the scanner.\n');
          execFileSync('pnpm',['install','--lockfile-only','--ignore-scripts'],{stdio:'inherit',timeout:300000});
          console.log('DEPENDENCY_REFRESH_WRITTEN',JSON.stringify({changedDirectPins:changes.length,baselineCounts}));
          NODE
      - name: Real advisory check before publishing dependency changes
        run: |
          node --input-type=module <<'NODE'
          import { runAudit } from './tools/dependency-audit.mjs';
          const result=runAudit();
          console.log('AFTER_AUDIT',JSON.stringify(result.report?.metadata??{error:result.message}));
          for(const a of Object.values(result.report?.advisories??{}))console.log('ADVISORY',JSON.stringify({package:a.module_name,id:a.github_advisory_id,severity:a.severity,patched:a.patched_versions,versions:a.findings?.map(f=>f.version)}));
          console.log(result.message);process.exitCode=result.code;
          NODE
      - name: Publish generated repair files to this branch only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          const git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim();
          const allowed=new Set(['package.json','apps/api/package.json','apps/web/package.json','packages/ai/package.json','packages/config/package.json','packages/core/package.json','packages/db/package.json','packages/storage/package.json','pnpm-lock.yaml','config/agent-lane-assignments.json','tools/agent-lane-boundary.test.mjs','docs/operations/dependency-remediation-2026-09-14.json','docs/decisions/CI-SECURITY-REFRESH-2026-09-14.md']);
          const changed=[...git('diff','--name-only','-z').split('\0'),...git('ls-files','--others','--exclude-standard','-z').split('\0')].filter(Boolean);
          if(!changed.length||changed.some(f=>!allowed.has(f)))throw new Error('Unexpected generated files: '+JSON.stringify(changed));
          git('config','user.name','github-actions[bot]');git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com');git('add','--',...changed);git('commit','-m','fix(deps): pin audited security updates; full CI still required');
          const auth=Buffer.from('x-access-token:'+process.env.GH_TOKEN).toString('base64');console.log('::add-mask::'+auth);
          execFileSync('git',['-c','http.https://github.com/.extraheader=AUTHORIZATION: basic '+auth,'push','origin','HEAD:refs/heads/codex/fix-jobguard-ci-guards-2026-09-14'],{stdio:'inherit'});
          console.log('PUBLISHED_DEPENDENCY_COMMIT',git('rev-parse','HEAD'));
          NODE
