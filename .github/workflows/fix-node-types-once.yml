name: Complete capture type dependency
on:
  push:
    branches: [codex/fix-jobguard-ci-guards-2026-09-14]
permissions:
  contents: read
jobs:
  repair:
    if: >-
      github.repository == 'ben2harwood-lgtm/jobguard' && startsWith(github.event.head_commit.message, 'fix(deps): declare the Node types required')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.2.2
        with: { ref: '${{ github.sha }}', fetch-depth: 0, persist-credentials: false }
      - uses: pnpm/action-setup@v4.1.0
        with: { version: 10.28.1, run_install: false }
      - uses: actions/setup-node@v4.0.3
        with: { node-version: 24.15.0 }
      - name: Add the same exact Node type version already used by the API
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const api=JSON.parse(readFileSync('apps/api/package.json','utf8'));
          const ai=JSON.parse(readFileSync('packages/ai/package.json','utf8'));
          if(api.devDependencies['@types/node']!=='24.0.3')throw new Error('The inspected API type pin changed');
          ai.devDependencies['@types/node']=api.devDependencies['@types/node'];
          writeFileSync('packages/ai/package.json',JSON.stringify(ai,null,2)+'\n');
          NODE
          pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
          node tools/dependency-audit.mjs
      - name: Publish only the manifest and generated lockfile to the repair branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          const git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim();
          if(process.env.GITHUB_REPOSITORY!=='ben2harwood-lgtm/jobguard'||process.env.GITHUB_REF_NAME!=='codex/fix-jobguard-ci-guards-2026-09-14')throw new Error('Wrong target');
          const changed=git('diff','--name-only','-z').split('\0').filter(Boolean);
          if(changed.length!==2||changed.some(p=>!['packages/ai/package.json','pnpm-lock.yaml'].includes(p)))throw new Error('Unexpected file changes '+JSON.stringify(changed));
          git('config','user.name','github-actions[bot]');git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com');
          git('add','--',...changed);git('commit','-m','fix(ai): explicitly declare capture module Node type dependency');
          const auth=Buffer.from('x-access-token:'+process.env.GH_TOKEN).toString('base64');console.log('::add-mask::'+auth);
          execFileSync('git',['-c','http.https://github.com/.extraheader=AUTHORIZATION: basic '+auth,'push','origin','HEAD:refs/heads/codex/fix-jobguard-ci-guards-2026-09-14'],{stdio:'inherit'});
          console.log('REPAIRED_COMMIT',git('rev-parse','HEAD'));
          NODE
