name: WORM local MinIO
on:
  pull_request:
    paths:
      - 'packages/storage/**'
      - '.github/workflows/worm-local-minio.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-minio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: pnpm/action-setup@v4.1.0
        with: { version: 10.28.1, run_install: false }
      - uses: actions/setup-node@v4.0.3
        with: { node-version: 24.15.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Start disposable synthetic local MinIO only
        run: |
          docker run -d --name synthetic-worm-minio -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=synthetic-local -e MINIO_ROOT_PASSWORD=synthetic-local-secret \
            minio/minio:RELEASE.2025-07-23T15-54-02Z server /data
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify local MinIO (does not prove production S3)
        env:
          JOBGUARD_TEST_LOCAL_MINIO: '1'
        run: pnpm --filter @jobguard/storage exec vitest run --maxWorkers=1 src/worm-minio.integration.test.ts
