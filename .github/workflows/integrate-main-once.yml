name: Reconcile JobGuard repair with new main
on:
  push:
    branches: [codex/fix-jobguard-ci-guards-2026-09-14]
permissions:
  contents: read
concurrency:
  group: jobguard-reconcile-once
  cancel-in-progress: false
jobs:
  reconcile:
    if: >-
      github.repository == 'ben2harwood-lgtm/jobguard' && startsWith(github.event.head_commit.message, 'fix(ci): reconcile the newly merged capture feature')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.2.2
        with: { ref: '${{ github.sha }}', fetch-depth: 0, persist-credentials: false }
      - uses: pnpm/action-setup@v4.1.0
        with: { version: 10.28.1, run_install: false }
      - uses: actions/setup-node@v4.0.3
        with: { node-version: 24.15.0 }
      - name: Merge pinned main while retaining security pins and all capture changes
        run: |
          node --input-type=module <<'NODE'
          import {execFileSync,spawnSync} from 'node:child_process';
          import {readFileSync,writeFileSync} from 'node:fs';
          if(process.env.GITHUB_REPOSITORY!=='ben2harwood-lgtm/jobguard'||process.env.GITHUB_REF_NAME!=='codex/fix-jobguard-ci-guards-2026-09-14')throw new Error('Wrong target');
          const git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim();
          const main='d753bfd8c822db976a960f7a1567cc6d2e651d36';
          git('config','user.name','github-actions[bot]');git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com');
          const attempt=spawnSync('git',['merge','--no-commit','--no-ff',main],{encoding:'utf8'});
          console.log(attempt.stdout,attempt.stderr);
          const conflicts=git('diff','--name-only','--diff-filter=U','-z').split('\0').filter(Boolean);
          const manifests=new Set(['apps/api/package.json','apps/web/package.json','packages/ai/package.json','packages/core/package.json']);
          if(attempt.status!==0&&!conflicts.length)throw new Error('Merge failed without resolvable conflicts');
          const eq=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
          function merge(base,ours,theirs,path){
            if(eq(ours,theirs)||eq(theirs,base))return ours;
            if(eq(ours,base))return theirs;
            if([base,ours,theirs].every(v=>v!==null&&typeof v==='object'&&!Array.isArray(v))){
              const result={};for(const key of new Set([...Object.keys(base),...Object.keys(ours),...Object.keys(theirs)])){
                const value=merge(base[key],ours[key],theirs[key],path+'.'+key);if(value!==undefined)result[key]=value;
              }return result;
            }
            throw new Error('Nontrivial competing change requires review: '+path);
          }
          for(const file of conflicts){
            if(file==='pnpm-lock.yaml'){git('checkout','--ours','--',file);continue;}
            if(!manifests.has(file))throw new Error('Unexpected source conflict: '+file);
            const content=merge(...[1,2,3].map(stage=>JSON.parse(git('show',`:${stage}:${file}`))),file);
            writeFileSync(file,JSON.stringify(content,null,2)+'\n');git('add','--',file);
          }
          const configFile='config/agent-lane-assignments.json';const config=JSON.parse(readFileSync(configFile,'utf8'));
          config.lanes['ci-repair'].allow=[...new Set([...config.lanes['ci-repair'].allow,'.github/workflows/integrate-main-once.yml'])];
          config.lanes['m1-2']={branches:['codex/implement-m1-2-capture-source'],branchPrefixes:['codex/m1-2'],allow:['apps/api/openapi.json','apps/api/package.json','apps/api/src/app.module.ts','apps/api/src/capture/**','apps/web/app/api/jobs/capture/**','apps/web/app/styles.css','apps/web/app/ui/jobguard-app.tsx','apps/web/e2e/capture.spec.ts','apps/web/package.json','packages/ai/package.json','packages/ai/src/capture.ts','packages/ai/src/capture.test.ts','packages/ai/src/index.ts','packages/core/package.json','packages/core/src/capture.ts','packages/core/src/capture.test.ts','packages/core/src/index.ts','packages/db/MIGRATIONS.md','packages/db/migrations/0007_capture.sql','packages/db/src/capture-repository.ts','packages/db/src/index.ts','packages/db/src/migrate.ts','packages/db/test/capture.integration.test.ts','packages/db/test/tenancy.integration.test.ts','pnpm-lock.yaml']};
          writeFileSync(configFile,JSON.stringify(config,null,2)+'\n');
          execFileSync('pnpm',['install','--lockfile-only','--ignore-scripts','--no-frozen-lockfile'],{stdio:'inherit',timeout:300000});
          git('add','--','pnpm-lock.yaml',configFile);
          const sourceDrift=git('diff',main,'--name-only','--','apps/api/src','apps/api/openapi.json','apps/web/app','apps/web/e2e','packages/ai/src','packages/core/src','packages/db/src','packages/db/migrations','packages/db/test','packages/db/MIGRATIONS.md');
          if(sourceDrift)throw new Error('Application or migration content differs from the new main: '+sourceDrift);
          if(git('diff','--name-only','--diff-filter=U'))throw new Error('Unresolved conflicts remain');
          git('commit','-m','chore(integration): preserve main capture feature alongside the CI security repair');
          console.log('RECONCILED_COMMIT',git('rev-parse','HEAD'));
          NODE
      - name: Audit the combined dependency lockfile
        run: node tools/dependency-audit.mjs
      - name: Publish only the reconciliation commit to the repair branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          const auth=Buffer.from('x-access-token:'+process.env.GH_TOKEN).toString('base64');console.log('::add-mask::'+auth);
          execFileSync('git',['-c','http.https://github.com/.extraheader=AUTHORIZATION: basic '+auth,'push','origin','HEAD:refs/heads/codex/fix-jobguard-ci-guards-2026-09-14'],{stdio:'inherit'});
          NODE
